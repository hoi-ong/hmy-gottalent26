<!DOCTYPE html>
<html lang="vi" data-theme="tuong-phan">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chấm điểm cuộc thi</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* ===== THEMES ===== */
:root{
  --bg:#000; --card:#151515; --field:#222; --text:#fff; --muted:#d4d4d4; --border:#777;
  --primary:#facc15; --primary-text:#111; --header:#000; --header-text:#facc15; --top:rgba(250,204,21,.18);
  --r:14px
}
html[data-theme="sang"]{
  --bg:#f1f5f9; --card:#fff; --field:#fff; --text:#0f172a; --muted:#334155; --border:#94a3b8;
  --primary:#b91c1c; --primary-text:#fff; --header:#b91c1c; --header-text:#fff; --top:#fef9c3
}
html[data-theme="ruc-ro"]{
  --bg:linear-gradient(135deg,#1e1b4b 0%,#6b21a8 55%,#be185d 100%);
  --card:rgba(20,10,50,.85); --field:#2e1065; --text:#fff; --muted:#e9d5ff; --border:#f0abfc;
  --primary:#fde047; --primary-text:#1e1b4b; --header:rgba(20,10,50,.92); --header-text:#fde047; --top:rgba(253,224,71,.22)
}

/* ===== BASE ===== */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45;font-size:17px}
header{background:var(--header);color:var(--header-text);padding:12px 14px;position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--primary)}
header h1{font-size:1.15rem;margin:0;flex:1 1 auto;color:inherit}
header select,header a.btn{font:inherit;font-size:1rem;padding:9px 10px;border-radius:10px;
  border:2px solid var(--primary);background:var(--field);color:var(--text);text-decoration:none}
header a.btn{background:var(--primary);color:var(--primary-text);font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:1rem}
.who[hidden]{display:none}
.who .btn-sec{padding:6px 10px;font-size:.9rem}
main{max-width:1100px;margin:0 auto;padding:14px}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#b45309;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:.95rem}
.msg{padding:28px;text-align:center;color:var(--muted);font-size:1.1rem}
.sub{color:var(--muted);font-size:.95rem}
.ok{color:#4ade80}.todo{color:var(--muted)}
.partial{color:#fdba74}

/* ===== LOGIN ===== */
.login{max-width:520px;margin:24px auto;background:var(--card);border:2px solid var(--primary);border-radius:var(--r);padding:20px}
.login input{font-size:1.15rem;padding:14px}
.login .btn-main{width:100%;margin-top:12px}

/* ===== LIST ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;
  text-align:left;font:inherit;color:inherit;width:100%}
.card:active{transform:scale(.98)}
.num{display:inline-block;background:var(--primary);color:var(--primary-text);border-radius:8px;padding:2px 10px;font-size:.95rem;font-weight:800}
.card h3{margin:8px 0 2px;font-size:1.15rem}
.status{margin-top:10px;font-size:1rem;font-weight:700}
.back{background:none;border:none;color:var(--primary);font:inherit;font-weight:700;padding:8px 0;cursor:pointer;font-size:1rem}
.ptitle{margin:4px 0 2px;font-size:1.4rem}

/* ===== BADGE & DISPLAY ===== */
.badge{display:inline-block;background:var(--bc);color:#111;font-weight:800;padding:3px 10px;border-radius:8px;font-size:.95rem}
.display{background:var(--card);border:3px solid var(--bc,var(--border));border-radius:var(--r);
  padding:12px;text-align:center;margin-bottom:14px}
.display .big{font-size:3.2rem;font-weight:900;line-height:1.05;color:var(--bc,var(--text))}
.display .big span{font-size:1.2rem;color:var(--muted);font-weight:700}
.display.small .big{font-size:2.6rem}
.display .blabel{margin-top:6px}

/* ===== TOGGLE ===== */
.toggle{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700;margin:6px 0 12px;cursor:pointer}
.toggle input{width:24px;height:24px;cursor:pointer}

/* ===== CRITERIA SECTIONS ===== */
.section{background:var(--card);border:1px solid var(--border);border-left:8px solid var(--c,var(--border));
  border-radius:var(--r);padding:14px;margin-bottom:14px}
.section-title{font-weight:800;font-size:1.1rem;margin-bottom:10px}
.ctag{display:inline-block;background:var(--c);color:#111;border-radius:8px;padding:1px 9px;margin-right:6px;font-size:1rem}

/* ===== SCORE BUTTONS 1–20 ===== */
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc{font:inherit;font-size:1.5rem;font-weight:900;border-radius:12px;padding:12px 0;cursor:pointer;
  border:3px solid var(--bc);background:var(--field);color:var(--text);min-height:60px}
.sc.sel{background:var(--bc);color:#111;box-shadow:0 0 0 3px var(--text) inset}

/* ===== GHI CHÚ NHẮC BÀI (4 mức) ===== */
.hints{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:12px}
.hint{border-radius:12px;padding:10px;background:var(--bc);color:#111;opacity:.5;text-align:left}
.hint b{display:block;font-size:1rem;margin-bottom:3px}
.hint small{font-size:.92rem;font-weight:600;line-height:1.35;display:block}
.hint.on{opacity:1;box-shadow:0 0 0 3px var(--text)}

/* ===== NOTES ===== */
.notes{margin-top:14px;border-top:1px dashed var(--border);padding-top:12px}
.notes-title{font-weight:800;margin-bottom:8px}
.notes-add{display:flex;gap:8px;margin-bottom:6px}
.notes-add input{flex:1}
input[type=text],textarea{width:100%;border:2px solid var(--border);border-radius:10px;padding:11px;font:inherit;
  background:var(--field);color:var(--text);font-size:1rem}
.note{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--field);margin-top:6px}
.note .ntext{flex:1;cursor:pointer}
.note.done .ntext{text-decoration:line-through;opacity:.6}
.note button{background:none;border:none;color:inherit;font-size:1.1rem;cursor:pointer;padding:0 6px}

/* ===== BOTTOM BAR & BUTTONS ===== */
.total{position:sticky;bottom:0;background:var(--card);border-top:3px solid var(--primary);padding:12px 14px;
  margin:0 -14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.total strong{font-size:1.3rem;color:var(--primary)}
.btn-main{background:var(--primary);color:var(--primary-text);border:none;border-radius:12px;padding:13px 20px;
  font:inherit;font-weight:800;cursor:pointer;font-size:1.05rem}
.btn-main:disabled{opacity:.4;cursor:not-allowed}
.btn-sec{background:var(--field);color:var(--text);border:2px solid var(--primary);border-radius:10px;
  padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn-danger{background:#dc2626;color:#fff;border:none;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}

/* ===== ADMIN ===== */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.toolbar h2{margin:0}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.pod{background:var(--card);border:3px solid var(--c);border-radius:var(--r);padding:16px;text-align:center}
.pod .medal{font-size:2.4rem;line-height:1}
.pod h3{margin:6px 0 2px;font-size:1.1rem}
.pod .score{font-size:2.2rem;font-weight:900;color:var(--c);margin-top:6px}
.pod .score span{font-size:1rem;color:var(--muted);font-weight:700}
.table-wrap{overflow-x:auto;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:.95rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
th{background:var(--field);font-size:.85rem}
th.ch{background:var(--c);color:#111}
td.l,th.l{text-align:left;white-space:normal;min-width:180px}
tr.top td{background:var(--top)}
.tot{font-weight:900;color:var(--primary);font-size:1.1rem}
details{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:700}
.jrow{padding:12px 0;border-bottom:1px dashed var(--border);font-size:.95rem}
.jrow .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cs{display:inline-block;margin:4px 10px 0 0;font-size:.9rem}
.jrow em{display:block;color:var(--muted);font-style:normal;margin-top:6px}
.nh{font-weight:700;margin-top:8px;font-size:.92rem}
.nlist{margin:2px 0 0;padding-left:0;list-style:none}
.nlist li{padding:2px 0}
.nlist li.done{text-decoration:line-through;opacity:.6}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 18px;
  border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99;font-size:1rem}
#toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>🏆 HMY GOT TALENT 2026</h1>
  <span id="who" class="who" hidden>👤 <b id="whoName"></b>
    <button class="btn-sec" data-rename>Đổi tên</button>
  </span>
  <select id="themeSel" aria-label="Chọn giao diện">
    <option value="tuong-phan">🌙 Tương phản cao</option>
    <option value="sang">☀️ Sáng</option>
    <option value="ruc-ro">🌈 Rực rỡ</option>
  </select>
  <a class="btn" id="adminLink" href="#admin">Tổng hợp</a>
</header>

<main>
  <div id="banner" class="banner" hidden>
    ⚠️ Chưa cấu hình Firebase: dữ liệu chỉ lưu trên trình duyệt này (chế độ thử nghiệm).
  </div>
  <div id="view"></div>
</main>

<div id="toast"></div>

<script>
/* =========================================================
   1. CẤU HÌNH
   ========================================================= */

// Dán cấu hình Firebase vào đây (xem hướng dẫn bên dưới). Để trống = chế độ thử nghiệm.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDQLIfZ_sZYR8uRK0qD7hmosuQWrTj9vMA",
  authDomain: "hmy-gottalent.firebaseapp.com",
  databaseURL: "https://hmy-gottalent-default-rtdb.asia-southeast1.firebasedatabase.app",   // ví dụ: "https://ten-du-an-default-rtdb.asia-southeast1.firebasedatabase.app"
  projectId: "hmy-gottalent"
};


const ADMIN_PIN = "1028";   // Mật khẩu vào trang tổng hợp. Đổi trước khi dùng
const RESET_PIN = "1028";   // Mật khẩu xác nhận reset bảng điểm. Đổi trước khi dùng

const PERFORMANCES = [
  { id: 1,  title: "Quyền Năng Sáng Tạo",        sub: "Giô-suê" },
  { id: 2,  title: "Who am I?",                  sub: "Thùy Linh - Phước Nguyên" },
  { id: 3,  title: "Bức Tranh Kỉ Niệm",          sub: "Áp-ra-ham" },
  { id: 4,  title: "Chiếc Gương",                sub: "Tamca trên Sampa" },
  { id: 5,  title: "Thế Hệ Đấng Christ",         sub: "Giê-rê-mi" },
  { id: 6,  title: "Đầu Phục Trước Chúa",        sub: "Thy Thy - Xuân Trọng" },
  { id: 7,  title: "Thoát Kén",                  sub: "Phi-e-rơ" },
  { id: 8,  title: "A Story Told Through Light", sub: "Giô-sép" },
  { id: 9,  title: "Xin Chúa Cứu Gia Đình Con",  sub: "Minh Toàn" },
  { id: 10, title: "Chúa Là Trung Tâm",          sub: "Nô-ê" }
];

// Thang điểm 1–20 cho mỗi tiêu chí
const MAX_SCORE = 20;
const SCORE_LIST = Array.from({ length: MAX_SCORE }, (_, i) => i + 1);

// 4 mức xếp loại, mỗi mức có màu riêng
const BANDS = [
  { name: "Tốt",      min: 17, max: 20, color: "#22c55e", range: "17 – 20 điểm" },
  { name: "Khá",      min: 10, max: 16, color: "#60a5fa", range: "10 – 16 điểm" },
  { name: "Đạt",      min: 5,  max: 9,  color: "#facc15", range: "5 – 9 điểm"   },
  { name: "Chưa đạt", min: 1,  max: 4,  color: "#f87171", range: "1 – 4 điểm"   }
];
const bandOf = s => (s == null ? null : (BANDS.find(b => s >= b.min && s <= b.max) || null));

// 5 tiêu chí theo tài liệu. desc = 4 mô tả (Tốt, Khá, Đạt, Chưa đạt).
const CRITERIA = [
  { key: "thongdiep", name: "Thông điệp", color: "#c084fc",
    desc: [
      "Thông điệp rõ ràng, sâu sắc, và tạo cảm xúc.",
      "Thông điệp rõ, phù hợp và có ý nghĩa.",
      "Có thông điệp nhưng còn đơn giản.",
      "Thông điệp chưa rõ hoặc chưa phù hợp."
    ] },
  { key: "chuyenmon", name: "Chuyên môn theo thể loại", color: "#fb923c",
    desc: [
      "Thực hiện thành thạo, chính xác; làm chủ kỹ năng đặc trưng của tiết mục; ít hoặc không có lỗi.",
      "Thực hiện tốt phần lớn yêu cầu; có một vài lỗi nhỏ nhưng không ảnh hưởng nhiều.",
      "Hoàn thành được tiết mục nhưng còn khá nhiều lỗi hoặc hạn chế về kỹ thuật.",
      "Chưa thực hiện được các yêu cầu cơ bản của tiết mục."
    ] },
  { key: "trinhdien", name: "Kỹ năng trình diễn", color: "#f472b6",
    desc: [
      "Tự tin, biểu cảm tốt, làm chủ sân khấu và thu hút khán giả.",
      "Tự tin, thể hiện tốt nhưng đôi lúc chưa ổn định.",
      "Có thể hoàn thành phần trình diễn nhưng còn thiếu tự tin/biểu cảm.",
      "Lúng túng, thiếu tự tin, chưa làm chủ sân khấu."
    ] },
  { key: "ydan", name: "Ý tưởng và dàn dựng", color: "#2dd4bf",
    desc: [
      "Sáng tạo, ấn tượng; dàn dựng, đạo cụ, phục trang phù hợp và nổi bật.",
      "Ý tưởng rõ ràng, có đầu tư; dàn dựng, đạo cụ, phục trang phù hợp.",
      "Ý tưởng đơn giản; dàn dựng, đạo cụ, phục trang cơ bản.",
      "Ý tưởng/dàn dựng chưa rõ; đạo cụ, phục trang chưa phù hợp."
    ] },
  { key: "tuongtac", name: "Tương tác", color: "#a3e635",
    desc: [
      "Phối hợp rất tốt, các thành viên đều có vai trò và hỗ trợ nhau.",
      "Phối hợp tốt, đa số thành viên tham gia tích cực.",
      "Có sự phối hợp nhưng chưa đồng đều.",
      "Phối hợp thiếu ăn ý, ảnh hưởng đến chất lượng tiết mục."
    ],
    descSolo: [
      "Kết nối tốt với khán giả, thu hút sự chú ý và tạo được sự hưởng ứng tích cực trong suốt tiết mục.",
      "Có sự kết nối với khán giả, tạo được sự chú ý và hưởng ứng ở phần lớn tiết mục.",
      "Có tương tác với khán giả nhưng còn hạn chế, chưa tạo được nhiều sự chú ý hoặc đồng cảm.",
      "Thiếu sự kết nối với khán giả, chưa thu hút được sự chú ý, hưởng ứng."
    ] }
];

const NOTE_COLOR = "#fde047";
const THEMES = ["tuong-phan", "sang", "ruc-ro"];

/* =========================================================
   2. LƯU TRỮ (Firebase nếu có cấu hình, ngược lại localStorage)
   Cấu trúc: entries/{tiếtMụcId}/{judgeId} = { solo, nhanxet, judgeName, c: { tiêuChí: { s, n:[{t,d}] } } }
   ========================================================= */
const useFirebase = !!FIREBASE_CONFIG.databaseURL;
let db = null;
if (useFirebase) {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}
const LOCAL_KEY = "cc_entries_v4";

function listen(cb) {
  if (useFirebase) { db.ref("entries").on("value", s => cb(s.val() || {})); return; }
  const load = () => cb(JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"));
  load();
  window.addEventListener("storage", load);
  window.addEventListener("local-save", load);
}

function write(perfId, judgeId, data) {
  if (useFirebase) return db.ref(`entries/${perfId}/${judgeId}`).set(data);
  const all = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}");
  all[perfId] = all[perfId] || {};
  all[perfId][judgeId] = data;
  localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
  window.dispatchEvent(new Event("local-save"));
  return Promise.resolve();
}

/* =========================================================
   3. TRẠNG THÁI & TIỆN ÍCH
   ========================================================= */
const state = {
  judge: localStorage.getItem("judge_id") || "",       // mã giám khảo (sinh tự động)
  judgeName: localStorage.getItem("judge_name") || "", // tên do giám khảo nhập
  perf: null,
  draft: null,
  noteIn: {},
  all: {},
  adminOK: false
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : (Math.round(n * 10) / 10).toString();
const toArr = x => Object.values(x || {});
const badge = b => b ? `<span class="badge" style="--bc:${b.color}">${b.name}</span>` : "";
const toast = msg => {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
};
// Chỉ render lại khi không đang nhập điểm/ghi chú, tránh mất dữ liệu đang gõ
const softRender = () => {
  if (location.hash === "#admin") return render();
  if (state.judge && state.perf == null) render();
};

const scoresOf = src => CRITERIA.map(c => src?.c?.[c.key]?.s ?? null);
const totalOf = src => {
  const ss = scoresOf(src);
  return ss.every(x => x != null) ? ss.reduce((a, b) => a + b, 0) / CRITERIA.length : null;
};

const emptyDraft = () => ({
  solo: false,
  nhanxet: "",
  c: Object.fromEntries(CRITERIA.map(c => [c.key, { s: null, n: [] }]))
});
function draftFrom(e) {
  const d = emptyDraft();
  if (!e) return d;
  d.solo = !!e.solo;
  d.nhanxet = e.nhanxet || "";
  CRITERIA.forEach(c => {
    const src = e.c?.[c.key] || {};
    d.c[c.key] = { s: src.s ?? null, n: toArr(src.n).map(x => ({ t: x.t, d: !!x.d })) };
  });
  return d;
}

// Lưu toàn bộ bản nháp lên server (tự động sau mỗi thay đổi)
function persist() {
  if (!state.judge || state.perf == null || !state.draft) return;
  const d = state.draft;
  const payload = {
    solo: !!d.solo,
    nhanxet: d.nhanxet || "",
    c: Object.fromEntries(CRITERIA.map(c => [c.key, { s: d.c[c.key].s, n: d.c[c.key].n }])),
    judgeName: state.judgeName,
    updatedAt: new Date().toISOString()
  };
  write(state.perf, state.judge, payload).catch(err => {
    console.error(err); toast("Lỗi lưu, thử lại");
  });
}

// Danh sách giám khảo đã xuất hiện trong dữ liệu: { judgeId: tên }
function judgesMap() {
  const m = {};
  Object.values(state.all).forEach(byJudge => {
    Object.entries(byJudge || {}).forEach(([jid, e]) => {
      if (e) m[jid] = e.judgeName || m[jid] || jid;
    });
  });
  return m;
}

/* =========================================================
   4. GIAO DIỆN GIÁM KHẢO
   ========================================================= */
function renderLogin() {
  return `
    <div class="login">
      <h2 class="ptitle">Nhập tên giám khảo</h2>
      <div class="sub">Tên sẽ hiển thị trong bảng tổng hợp của thư ký.</div>
      <div style="margin-top:12px">
        <input type="text" id="jname" maxlength="40" placeholder="Ví dụ: Nguyễn Văn A" autocomplete="off">
      </div>
      <button class="btn-main" data-login>Vào chấm điểm</button>
    </div>`;
}

function renderList() {
  return `<div class="grid">${PERFORMANCES.map(p => {
    const e = state.all[p.id]?.[state.judge];
    const n = scoresOf(e).filter(x => x != null).length;
    const t = totalOf(e);
    const tb = t != null ? bandOf(Math.round(t)) : null;
    const nJudges = Object.values(state.all[p.id] || {}).filter(x => totalOf(x) != null).length;
    const status = t != null
      ? `<div class="status" style="color:${tb.color}">✔ ${fmt(t)}/${MAX_SCORE} · ${tb.name}</div>`
      : `<div class="status todo">${n ? `Đang chấm: ${n}/${CRITERIA.length} tiêu chí` : "Chưa chấm"}</div>`;
    return `<button class="card" data-open="${p.id}">
      <span class="num">#${p.id}</span>
      <h3>${esc(p.title)}</h3>
      <div class="sub">${esc(p.sub)}</div>
      ${status}
      <div class="sub" style="margin-top:4px">Đã đủ điểm: ${nJudges} giám khảo</div>
    </button>`;
  }).join("")}</div>`;
}

function renderNotes(c) {
  const list = state.draft.c[c.key].n;
  const items = list.map((n, j) => `
    <div class="note ${n.d ? "done" : ""}">
      <span class="ntext" data-togglenote="${c.key}:${j}">${n.d ? "☑" : "☐"} ${esc(n.t)}</span>
      <button data-delnote="${c.key}:${j}" aria-label="Xóa">✕</button>
    </div>`).join("");
  return items || `<div class="sub" style="margin-top:6px">Chưa có ghi chú.</div>`;
}

function renderCriterion(c, i) {
  const d = state.draft;
  const cd = d.c[c.key];
  const b = bandOf(cd.s);
  const descs = (c.key === "tuongtac" && d.solo) ? c.descSolo : c.desc;

  const scoreBtns = SCORE_LIST.map(n => {
    const bb = bandOf(n);
    return `<button class="sc ${cd.s === n ? "sel" : ""}" style="--bc:${bb.color}"
              data-crit="${c.key}" data-score="${n}">${n}</button>`;
  }).join("");

  const hints = BANDS.map((bb, k) => `
    <div class="hint ${b && b.name === bb.name ? "on" : ""}" style="--bc:${bb.color}">
      <b>${bb.name} · ${bb.range}</b>
      <small>${esc(descs[k])}</small>
    </div>`).join("");

  return `
    <div class="section" style="--c:${c.color}">
      <div class="section-title"><span class="ctag">${i + 1}</span>${esc(c.name)}${(c.key === "tuongtac" && d.solo) ? ` <span class="sub">(cá nhân)</span>` : ""}</div>

      <div class="display small" style="--bc:${b ? b.color : "var(--border)"}">
        <div class="big">${cd.s ?? "—"}<span> / ${MAX_SCORE}</span></div>
        <div class="blabel">${b ? badge(b) : `<span class="sub">Chưa chọn điểm</span>`}</div>
      </div>

      <div class="scores">${scoreBtns}</div>
      <div class="hints">${hints}</div>

      <div class="notes">
        <div class="notes-title">📝 Ghi chú nhắc bài</div>
        <div class="notes-add">
          <input type="text" id="ni-${c.key}" data-noteinput="${c.key}"
                 value="${esc(state.noteIn[c.key] || "")}" placeholder="Ý cần nói...">
          <button class="btn-sec" data-addnote="${c.key}">+ Thêm</button>
        </div>
        ${renderNotes(c)}
      </div>
    </div>`;
}

function renderForm() {
  const p = PERFORMANCES.find(x => x.id === state.perf);
  const d = state.draft;
  const n = scoresOf(d).filter(x => x != null).length;
  const t = totalOf(d);
  const tb = t != null ? bandOf(Math.round(t)) : null;

  return `
    <button class="back" data-back>← Danh sách tiết mục</button>
    <h2 class="ptitle">#${p.id} · ${esc(p.title)}</h2>
    <div class="sub" style="margin-bottom:8px">${esc(p.sub)}</div>

    <label class="toggle">
      <input type="checkbox" id="soloChk" ${d.solo ? "checked" : ""}>
      Tiết mục cá nhân (đổi mô tả tiêu chí Tương tác)
    </label>

    <div class="display" style="--bc:${tb ? tb.color : "var(--border)"}">
      <div class="sub">Điểm tiết mục (trung bình 5 tiêu chí)</div>
      <div class="big">${t != null ? fmt(t) : "—"}<span> / ${MAX_SCORE}</span></div>
      <div class="blabel">${tb ? badge(tb) : `<span class="sub">Đã chấm ${n}/${CRITERIA.length} tiêu chí</span>`}</div>
    </div>

    ${CRITERIA.map((c, i) => renderCriterion(c, i)).join("")}

    <div class="section" style="--c:var(--border)">
      <div class="section-title">Nhận xét chung (không bắt buộc)</div>
      <textarea id="nx" placeholder="Nhận xét cho tiết mục...">${esc(d.nhanxet)}</textarea>
    </div>

    <div class="total">
      <div>Đã chấm: <strong>${n}/${CRITERIA.length}</strong> tiêu chí</div>
      <button class="btn-main" data-done ${n < CRITERIA.length ? "disabled" : ""}>Hoàn tất</button>
    </div>`;
}

function renderJudge() {
  if (!state.judge) return renderLogin();
  return state.perf == null ? renderList() : renderForm();
}

function login() {
  const v = ($("#jname")?.value || "").trim();
  if (!v) { toast("Vui lòng nhập tên"); return; }
  state.judge = "gk_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  state.judgeName = v;
  localStorage.setItem("judge_id", state.judge);
  localStorage.setItem("judge_name", v);
  render();
}

// Đổi tên: giữ nguyên mã giám khảo, cập nhật tên trong các điểm đã lưu
function rename() {
  const v = (prompt("Nhập tên mới:", state.judgeName) || "").trim();
  if (!v || v === state.judgeName) return;
  state.judgeName = v;
  localStorage.setItem("judge_name", v);
  Object.keys(state.all).forEach(pid => {
    const e = state.all[pid]?.[state.judge];
    if (e) write(pid, state.judge, { ...e, judgeName: v }).catch(err => {
      console.error(err); toast("Lỗi đổi tên");
    });
  });
  toast("✔ Đã đổi tên");
  render();
}

function openPerf(id) {
  state.perf = id;
  state.draft = draftFrom(state.all[id]?.[state.judge]);
  state.noteIn = {};
  render();
  window.scrollTo(0, 0);
}

function closeForm() {
  state.perf = null; state.draft = null; state.noteIn = {};
  render(); window.scrollTo(0, 0);
}

function setScore(key, n) {
  state.draft.c[key].s = n;
  persist(); render();
}

function addNote(key) {
  const v = (state.noteIn[key] || "").trim();
  if (!v) return;
  state.draft.c[key].n.push({ t: v, d: false });
  state.noteIn[key] = "";
  persist(); render();
  document.getElementById(`ni-${key}`)?.focus();
}

/* =========================================================
   5. GIAO DIỆN THƯ KÝ (TỔNG HỢP)
   ========================================================= */
function computeRows() {
  const jm = judgesMap();
  const ids = Object.keys(jm);
  const rows = PERFORMANCES.map(p => {
    const per = ids.map(id => ({ id, name: jm[id], e: state.all[p.id]?.[id] || null }));
    const done = per.filter(x => totalOf(x.e) != null);
    const avg = done.length ? done.reduce((a, x) => a + totalOf(x.e), 0) / done.length : null;
    const crit = {};
    CRITERIA.forEach(c => {
      const ss = done.map(x => x.e.c?.[c.key]?.s).filter(v => v != null);
      crit[c.key] = ss.length ? ss.reduce((a, b) => a + b, 0) / ss.length : null;
    });
    return { p, per, done, avg, crit };
  });
  rows.forEach(r => {
    r.rank = r.avg == null ? null : 1 + rows.filter(o => o.avg != null && o.avg > r.avg).length;
  });
  return { rows, ids, jm };
}

function renderAdmin() {
  if (!state.adminOK) {
    const pin = prompt("Nhập mật khẩu thư ký:");
    if (pin !== ADMIN_PIN) { location.hash = ""; return ""; }
    state.adminOK = true;
  }
  const { rows, ids } = computeRows();
  const N = ids.length;
  const sorted = [...rows].sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1) || a.p.id - b.p.id);
  const top3 = sorted.filter(r => r.avg != null).slice(0, 3);
  const medals = [["🥇", "#facc15"], ["🥈", "#cbd5e1"], ["🥉", "#fb923c"]];

  const podium = top3.length ? `
    <h2 style="margin:0 0 10px">🏆 Bảng xếp hạng</h2>
    <div class="podium">
      ${top3.map((r, i) => `
        <div class="pod" style="--c:${medals[i][1]}">
          <div class="medal">${medals[i][0]}</div>
          <div class="sub">#${r.p.id} · ${esc(r.p.sub)}</div>
          <h3>${esc(r.p.title)}</h3>
          <div class="score">${fmt(r.avg)}<span>/${MAX_SCORE}</span></div>
          <div style="margin-top:6px">${badge(bandOf(Math.round(r.avg)))}</div>
        </div>`).join("")}
    </div>` : `<div class="msg">Chưa có điểm nào.</div>`;

  const body = sorted.map(r => `
    <tr class="${r.rank === 1 ? "top" : ""}">
      <td>${r.rank ?? "—"}</td>
      <td>${r.p.id}</td>
      <td class="l"><b>${esc(r.p.title)}</b><br><span class="sub">${esc(r.p.sub)}</span></td>
      ${CRITERIA.map(c => `<td>${fmt(r.crit[c.key])}</td>`).join("")}
      <td class="tot">${fmt(r.avg)}</td>
      <td>${r.avg == null ? "—" : badge(bandOf(Math.round(r.avg)))}</td>
      <td>${r.done.length}/${N}${r.done.length && r.done.length < N
        ? `<div class="partial">chưa đủ</div>` : ""}</td>
    </tr>`).join("");

  const details = rows.map(r => {
    const withData = r.per.filter(x => x.e);
    return `
    <details>
      <summary>#${r.p.id} · ${esc(r.p.title)} — TB ${fmt(r.avg)}/${MAX_SCORE}${withData.some(x => x.e.solo) ? " · cá nhân" : ""}</summary>
      ${withData.length ? withData.map(x => {
        const t = totalOf(x.e);
        const n = scoresOf(x.e).filter(v => v != null).length;
        const head = t != null
          ? `${fmt(t)}/${MAX_SCORE} ${badge(bandOf(Math.round(t)))}`
          : `<span class="partial">Chưa đủ: ${n}/${CRITERIA.length} tiêu chí</span>`;
        const scoreLine = CRITERIA.map(c =>
          `<span class="cs">${esc(c.name)}: <b>${x.e.c?.[c.key]?.s ?? "—"}</b></span>`).join("");
        const notesLines = CRITERIA.map(c => {
          const list = toArr(x.e.c?.[c.key]?.n);
          if (!list.length) return "";
          return `<div class="nh">${esc(c.name)}</div>
            <ul class="nlist">${list.map(n => `<li class="${n.d ? "done" : ""}">${n.d ? "☑" : "☐"} ${esc(n.t)}</li>`).join("")}</ul>`;
        }).join("");
        return `
          <div class="jrow">
            <div class="head"><b>${esc(x.name)}${x.e.solo ? " · cá nhân" : ""}</b><span>${head}</span></div>
            <div>${scoreLine}</div>
            ${x.e.nhanxet ? `<em>“${esc(x.e.nhanxet)}”</em>` : ""}
            ${notesLines}
          </div>`;
      }).join("") : `<div class="sub" style="margin-top:8px">Chưa có giám khảo nào chấm.</div>`}
    </details>`;
  }).join("");

  return `
    ${podium}
    <div class="toolbar">
      <h2>Tổng hợp điểm</h2>
      <div class="tbtns">
        <button class="btn-sec" data-export>⬇ Xuất CSV</button>
        <button class="btn-danger" data-reset>🗑 Reset bảng điểm</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Hạng</th><th>STT</th><th class="l">Tiết mục</th>
          ${CRITERIA.map(c => `<th class="ch" style="--c:${c.color}">${esc(c.name)}<br>(TB /${MAX_SCORE})</th>`).join("")}
          <th>TB /${MAX_SCORE}</th><th>Xếp loại</th><th>GK</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <h3 style="margin:22px 0 8px">Chi tiết từng giám khảo, nhận xét & ghi chú</h3>
    ${details}`;
}

function exportCSV() {
  const { rows, ids, jm } = computeRows();
  const header = ["Hạng", "STT", "Tiết mục", "Tác giả", ...CRITERIA.map(c => c.name + " (TB)"),
                  "TB /20", "Xếp loại", "Số GK đủ điểm", ...ids.map(id => jm[id] + " (điểm)")];
  const lines = rows.map(r => [
    r.rank ?? "", r.p.id, r.p.title, r.p.sub,
    ...CRITERIA.map(c => fmt(r.crit[c.key])),
    fmt(r.avg), r.avg == null ? "" : (bandOf(Math.round(r.avg))?.name || ""), r.done.length,
    ...r.per.map(x => { const t = totalOf(x.e); return t != null ? fmt(t) : ""; })
  ]);
  const csv = [header, ...lines]
    .map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))
    .join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tong_hop_diem.csv";
  a.click();
}

// Reset bảng điểm: yêu cầu mật khẩu reset và xác nhận lần cuối
function resetAll() {
  const pin = prompt("Nhập mật khẩu reset để xóa TOÀN BỘ điểm và ghi chú:");
  if (pin === null) return;
  if (pin !== RESET_PIN) { toast("Sai mật khẩu, chưa reset"); return; }
  if (!confirm("Xóa toàn bộ điểm, nhận xét và ghi chú của tất cả giám khảo? Không thể khôi phục.")) return;

  const done = () => { toast("✔ Đã reset bảng điểm"); render(); };
  if (useFirebase) {
    db.ref("entries").remove().then(done).catch(err => {
      console.error(err); toast("Lỗi reset, thử lại");
    });
  } else {
    localStorage.removeItem(LOCAL_KEY);
    window.dispatchEvent(new Event("local-save"));
    done();
  }
}

/* =========================================================
   6. GIAO DIỆN & ĐIỀU KHIỂN CHUNG
   ========================================================= */
function setTheme(t) {
  if (!THEMES.includes(t)) t = "tuong-phan";
  document.documentElement.dataset.theme = t;
  localStorage.setItem("theme", t);
  $("#themeSel").value = t;
}

function render() {
  const isAdmin = location.hash === "#admin";
  $("header h1").textContent = isAdmin ? "📊 Thư ký — Tổng hợp" : "🏆 Chấm điểm cuộc thi";
  $("#adminLink").textContent = isAdmin ? "← Giám khảo" : "Tổng hợp";
  $("#adminLink").href = isAdmin ? "#" : "#admin";
  $("#who").hidden = isAdmin || !state.judge;
  $("#whoName").textContent = state.judgeName;
  $("#view").innerHTML = isAdmin ? renderAdmin() : renderJudge();
  if (!isAdmin && !state.judge) $("#jname")?.focus();
}

document.addEventListener("click", e => {
  const t = e.target;

  if (t.closest("[data-login]")) return login();
  if (t.closest("[data-rename]")) return rename();
  if (t.closest("[data-reset]")) return resetAll();

  const open = t.closest("[data-open]");
  if (open) return openPerf(Number(open.dataset.open));

  if (t.closest("[data-back]")) return closeForm();

  const sc = t.closest("[data-crit]");
  if (sc) return setScore(sc.dataset.crit, Number(sc.dataset.score));

  const add = t.closest("[data-addnote]");
  if (add) return addNote(add.dataset.addnote);

  const tg = t.closest("[data-togglenote]");
  if (tg) {
    const [key, j] = tg.dataset.togglenote.split(":");
    const item = state.draft.c[key].n[Number(j)];
    item.d = !item.d;
    persist(); render(); return;
  }

  const dn = t.closest("[data-delnote]");
  if (dn) {
    const [key, j] = dn.dataset.delnote.split(":");
    state.draft.c[key].n.splice(Number(j), 1);
    persist(); render(); return;
  }

  if (t.closest("[data-done]")) {
    if (totalOf(state.draft) == null) return;
    persist();
    toast("✔ Đã lưu đầy đủ điểm");
    closeForm(); return;
  }

  if (t.closest("[data-export]")) exportCSV();
});

// Cập nhật bản nháp khi gõ (không render lại để khỏi mất con trỏ)
document.addEventListener("input", e => {
  if (e.target.id === "nx" && state.draft) state.draft.nhanxet = e.target.value;
  if (e.target.dataset.noteinput) state.noteIn[e.target.dataset.noteinput] = e.target.value;
});

document.addEventListener("change", e => {
  if (e.target.id === "nx" && state.draft) persist();
  if (e.target.id === "soloChk" && state.draft) {
    state.draft.solo = e.target.checked;
    persist(); render();
  }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "jname") { e.preventDefault(); login(); }
  if (e.target.dataset.noteinput) { e.preventDefault(); addNote(e.target.dataset.noteinput); }
});

$("#themeSel").addEventListener("change", e => setTheme(e.target.value));

window.addEventListener("hashchange", () => {
  state.adminOK = state.adminOK && location.hash === "#admin";
  render();
});

/* =========================================================
   7. KHỞI ĐỘNG
   ========================================================= */
$("#banner").hidden = useFirebase;
setTheme(localStorage.getItem("theme") || "tuong-phan");

listen(all => { state.all = all || {}; softRender(); });
render();
</script>
</body>
</html>
